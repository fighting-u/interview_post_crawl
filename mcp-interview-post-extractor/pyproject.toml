[project]
name = "interview-crawl-mcp"
version = "0.1.0"
description = "MCP server for fetching interview posts from NowCoder and Xiaohongshu."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "mcp[cli]>=1.10.0",
    "playwright>=1.53.0",
    "requests>=2.32.3",
    "tencentcloud-sdk-python>=3.0.0",
    "xhshow>=0.1.9",
]

[project.scripts]
interview-crawl-mcp = "interview_crawl_mcp.server:main"
maintain-xhs-login = "maintain_xhs_login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/interview_crawl_mcp"]
force-include = { "maintain_xhs_login.py" = "maintain_xhs_login.py" }
